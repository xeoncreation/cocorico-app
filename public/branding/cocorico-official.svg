<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Definiciones de gradientes suaves -->
    <radialGradient id="bodyGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#F0CC73;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8B84D;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="hatGradient" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F4F0E6;stop-opacity:1" />
    </radialGradient>
    <filter id="softShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Cuerpo del pollito - forma ovalada redondeada -->
  <g filter="url(#softShadow)">
    <!-- Capa inferior verde -->
    <ellipse cx="256" cy="340" rx="140" ry="100" fill="#7FB28F" stroke="#1A1A1A" stroke-width="2"/>
    
    <!-- Capa media amarilla -->
    <ellipse cx="256" cy="280" rx="155" ry="120" fill="url(#bodyGradient)" stroke="#1A1A1A" stroke-width="2"/>
    
    <!-- Capa superior naranja/roja -->
    <ellipse cx="256" cy="220" rx="145" ry="110" fill="#E36A4A" stroke="#1A1A1A" stroke-width="2"/>
    
    <!-- Cabeza (parte superior) -->
    <circle cx="256" cy="180" r="100" fill="url(#bodyGradient)" stroke="#1A1A1A" stroke-width="2"/>
  </g>
  
  <!-- Gorro de chef -->
  <g transform="rotate(-8 256 256)">
    <!-- Base del gorro -->
    <ellipse cx="268" cy="120" rx="75" ry="18" fill="url(#hatGradient)" stroke="#1A1A1A" stroke-width="2"/>
    
    <!-- Parte superior del gorro (inflada) -->
    <path d="M 193 120 Q 193 70, 230 50 Q 268 35, 306 50 Q 343 70, 343 120 L 335 122 Q 335 75, 268 60 Q 201 75, 201 122 Z" 
          fill="url(#hatGradient)" stroke="#1A1A1A" stroke-width="2"/>
    
    <!-- Pliegues del gorro -->
    <path d="M 220 90 Q 225 75, 235 70" stroke="#E8E4DA" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M 268 55 Q 268 45, 275 42" stroke="#E8E4DA" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M 310 75 Q 315 65, 320 63" stroke="#E8E4DA" stroke-width="1.5" fill="none" opacity="0.6"/>
  </g>
  
  <!-- Ojos grandes y brillantes -->
  <g>
    <!-- Ojo izquierdo -->
    <circle cx="220" cy="175" r="22" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="2"/>
    <circle cx="228" cy="168" r="8" fill="#FFFFFF"/>
    <circle cx="232" cy="172" r="3" fill="#FFFFFF" opacity="0.6"/>
    
    <!-- Ojo derecho -->
    <circle cx="292" cy="175" r="22" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="2"/>
    <circle cx="300" cy="168" r="8" fill="#FFFFFF"/>
    <circle cx="304" cy="172" r="3" fill="#FFFFFF" opacity="0.6"/>
  </g>
  
  <!-- Pico pequeño (mini triangulito) -->
  <g>
    <path d="M 256 200 L 270 210 L 256 215 Z" fill="#F2A75D" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
    <!-- Detalles del pico -->
    <line x1="256" y1="207" x2="265" y2="210" stroke="#D97941" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- Mejillas rosadas (blush) para darle el toque kawaii -->
  <ellipse cx="185" cy="195" rx="18" ry="12" fill="#FF9999" opacity="0.3"/>
  <ellipse cx="327" cy="195" rx="18" ry="12" fill="#FF9999" opacity="0.3"/>
  
  <!-- Patitas -->
  <g>
    <!-- Pata izquierda -->
    <ellipse cx="220" cy="420" rx="25" ry="15" fill="#D97941" stroke="#1A1A1A" stroke-width="2"/>
    <path d="M 205 432 L 200 445 M 220 433 L 220 448 M 235 432 L 240 445" 
          stroke="#D97941" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Pata derecha -->
    <ellipse cx="292" cy="420" rx="25" ry="15" fill="#D97941" stroke="#1A1A1A" stroke-width="2"/>
    <path d="M 277 432 L 272 445 M 292 433 L 292 448 M 307 432 L 312 445" 
          stroke="#D97941" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Destello de personalidad (pequeña pluma en la cabeza) -->
  <g>
    <path d="M 256 85 Q 250 75, 248 65" stroke="#E36A4A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 256 85 Q 260 78, 264 72" stroke="#E36A4A" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
