name: Supabase Keep-Alive

on:
  schedule:
    # Ejecuta todos los días a las 12:00 UTC (ajusta según tu zona horaria)
    - cron: '0 12 * * *'
  workflow_dispatch: # Permite ejecución manual

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Instalar dependencias
        run: npm ci
      
      - name: Crear .env.local con secrets
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-}" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}" >> .env.local
          echo "IMPORT_USER_ID=${IMPORT_USER_ID:-}" >> .env.local
      
      - name: Generar actividad en Supabase
        run: npm run supabase:keep-alive
      
      - name: Notificar resultado
        if: always()
        run: |
          if [ $? -eq 0 ]; then
            echo "✅ Actividad generada exitosamente"
          else
            echo "❌ Error al generar actividad"
            exit 1
          fi
